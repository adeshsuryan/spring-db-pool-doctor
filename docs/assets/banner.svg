<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <!-- magnifier ring -->
  <g transform="translate(90,60)" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="95" cy="95" r="70"/>
    <line x1="145" y1="145" x2="200" y2="200"/>
  </g>
  <!-- pool inside the lens: grid of connections, two saturated/one waiting -->
  <g transform="translate(105,95)" stroke-width="5" stroke-linecap="round" fill="none">
    <circle cx="-34" cy="-14" r="8" fill="#34d399" stroke="none"/>
    <circle cx="8" cy="-14" r="8" fill="#34d399" stroke="none"/>
    <circle cx="50" cy="-14" r="8" fill="#fbbf24" stroke="none"/>
    <circle cx="-34" cy="26" r="8" fill="#fbbf24" stroke="none"/>
    <circle cx="8" cy="26" r="8" fill="#fbbf24" stroke="none"/>
    <circle cx="50" cy="26" r="8" fill="none" stroke="#f87171" stroke-dasharray="4 4"/>
    <line x1="50" y1="38" x2="50" y2="52" stroke="#f87171"/>
    <circle cx="50" cy="56" r="3" fill="#f87171" stroke="none"/>
  </g>
  <text x="380" y="140" font-family="SF Mono, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#f8fafc">spring-db-pool-doctor</text>
  <text x="384" y="200" font-family="SF Mono, Menlo, Consolas, monospace" font-size="30" fill="#94a3b8">"Connection is not available" — now you know why</text>
  <g transform="translate(384,236)">
    <rect width="172" height="34" rx="6" fill="#164e3f"/>
    <text x="14" y="23" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#34d399">pool saturation</text>
    <rect x="184" width="172" height="34" rx="6" fill="#0c4a5e"/>
    <text x="198" y="23" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#22d3ee">leak suspects</text>
    <rect x="368" width="160" height="34" rx="6" fill="#3f3a15"/>
    <text x="382" y="23" font-family="SF Mono, Menlo, Consolas, monospace" font-size="18" fill="#fbbf24">hold-time</text>
  </g>
</svg>
