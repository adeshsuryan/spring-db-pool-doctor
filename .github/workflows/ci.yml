name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: mvn -B verify -DskipITs

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pooltest
          POSTGRES_USER: doctor
          POSTGRES_PASSWORD: doctor
        ports: ["5443:5432"]
        options: >-
          --health-cmd "pg_isready -U doctor -d pooltest"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
        env:
          IT_JDBC_URL: jdbc:postgresql://localhost:5443/pooltest
          IT_DB_USER: doctor
          IT_DB_PASSWORD: doctor

  boot-matrix:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pooltest
          POSTGRES_USER: doctor
          POSTGRES_PASSWORD: doctor
        ports: ["5443:5432"]
        options: >-
          --health-cmd "pg_isready -U doctor -d pooltest"
          --health-interval 5s --health-timeout 3s --health-retries 10
    strategy:
      matrix:
        spring-boot: ["3.2.12", "3.3.13", "3.4.10", "3.5.16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify -Dspring-boot.version=${{ matrix.spring-boot }}
        env:
          IT_JDBC_URL: jdbc:postgresql://localhost:5443/pooltest
          IT_DB_USER: doctor
          IT_DB_PASSWORD: doctor

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-db-${{ runner.os }}-
      - run: mvn -B verify -DskipITs -Paudit
        env:
          # Optional: add a repository secret NVD_API_KEY (nvd.nist.gov key)
          # for faster, unthrottled NVD syncs. The audit works without it.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: ignore
